spring:
  application:
    name: JVM Auction Application Backend

  threads:
    virtual:
      enabled: true

  devtools:
    restart:
      enabled: false

  config:
    import: optional:file:.env[.properties]

  mongodb:
    uri: mongodb://${MONGODB_ADMINUSERNAME}:${MONGODB_ADMINPASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/${MONGODB_DATABASE}?authSource=admin

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 60000
