version: "3.9"

services:

  mongobase:
    image: mongo:7.0.0
    container_name: mongobase
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_ADMINUSERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_ADMINPASSWORD}
      - MONGO_INITDB_DATABASE=${MONGODB_INITDB}
    volumes:
      - mongo_data:/data/db
    command: ["--auth"]

  redisbase:
    image: redis:8.0.5
    container_name: redisbase
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
  